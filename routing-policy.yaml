version: 0

static_rules:
  low:
    - git_status
    - git_log
    - git_diff_inspection
    - create_branch
    - switch_branch
    - stage_files
    - straightforward_commit
    - mechanical_file_operation
    - formatting
  medium:
    - localized_implementation
    - bounded_documentation
    - small_pr_description
    - routine_review
  high:
    - architecture
    - ambiguous_debugging
    - root_cause_analysis
    - cross_cutting_refactor
    - security_sensitive_change
    - complex_performance_investigation

confidence:
  accept: 0.85
  medium_floor: 0.60
